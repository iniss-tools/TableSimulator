<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>TableSimulator</title>
  <style>
    body { margin: 0; padding: 12px; background: #111; color: #ffb000; font-family: system-ui, sans-serif; }
    .meta { color: #888; font-size: 12px; margin-bottom: 8px; }
    pre { margin: 0; font-family: Consolas, monospace; font-size: 18px; white-space: pre; }
    #log { margin-top: 12px; color: #666; font: 11px Consolas, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="meta" id="meta">TableSimulator - sonda MCP Apps, cakam na vysledok nastroja</div>
  <pre id="rows"></pre>
  <div id="log"></div>
  <script>
    // Sonda MCP Apps bez kniznice: JSON-RPC cez postMessage s hostitelom (ui/initialize, argumenty a vysledok nastroja,
    // tools/call). Pod tabulou kratky zaznam sprav - na zistenie, co hostitel posiela.
    let nextId = 1;
    const pending = new Map();
    let boardId = null;
    let polling = false;
    const lines = [];

    function log(text) {
      lines.push(new Date().toISOString().slice(11, 19) + " " + text);
      if (lines.length > 12) lines.shift();
      document.getElementById("log").textContent = lines.join("\n");
      resize();
    }

    window.addEventListener("message", (event) => {
      let message = event.data;
      if (typeof message === "string") {
        try { message = JSON.parse(message); } catch { log("text: " + message.slice(0, 80)); return; }
      }
      if (!message || message.jsonrpc !== "2.0") { log("ina sprava: " + JSON.stringify(message).slice(0, 120)); return; }
      if (message.id !== undefined && message.method === undefined) {
        log("odpoved " + message.id + (message.error ? " CHYBA " + JSON.stringify(message.error).slice(0, 120) : ""));
        const waiting = pending.get(message.id);
        if (waiting) {
          pending.delete(message.id);
          if (message.error) waiting.reject(message.error);
          else waiting.resolve(message.result);
        }
        return;
      }
      log("<- " + message.method + " " + JSON.stringify(message.params || {}).slice(0, 100));
      if (message.method === "ui/notifications/tool-input") onToolInput(message.params);
      if (message.method === "ui/notifications/tool-result") onToolResult(message.params);
      if (message.id !== undefined) window.parent.postMessage({ jsonrpc: "2.0", id: message.id, result: {} }, "*");
    });

    function request(method, params) {
      const id = nextId++;
      log("-> " + method + " #" + id);
      window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
    }

    function notify(method, params) {
      log("-> " + method);
      window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
    }

    function resize() {
      window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/size-changed", params: { height: document.documentElement.scrollHeight } }, "*");
    }

    /** Strukturovany obsah vysledku nastroja, inak JSON z textu (niektori hostitelia posielaju len text). */
    function dataOf(result) {
      if (!result) return null;
      if (result.structuredContent) return result.structuredContent;
      const text = (result.content || []).find((c) => c.type === "text");
      try { return text ? JSON.parse(text.text) : null; } catch { return null; }
    }

    function show(id, version, rows) {
      document.getElementById("meta").textContent = "Tabula " + id + " - verzia " + version;
      document.getElementById("rows").textContent = rows.join("\n");
      resize();
    }

    function start(id, version) {
      if (!id) return;
      boardId = id;
      if (!polling) {
        polling = true;
        void poll(version);
      }
    }

    function onToolInput(params) {
      start(params && params.arguments && params.arguments.id, 0);
    }

    function onToolResult(result) {
      const board = dataOf(result);
      if (!board) { log("vysledok bez udajov"); return; }
      show(board.id, board.version, board.rows);
      start(board.id, board.version);
    }

    async function poll(version) {
      for (;;) {
        try {
          const change = dataOf(await request("tools/call", { name: "board_view", arguments: { id: boardId, afterVersion: version, timeoutSeconds: 25 } }));
          if (change) {
            version = change.board.version;
            if (change.changed) show(change.board.id, version, change.board.rows);
          }
        } catch (error) {
          log("board_view chyba: " + JSON.stringify(error).slice(0, 160));
          await new Promise((r) => setTimeout(r, 3000));
        }
      }
    }

    void (async () => {
      try {
        const result = await request("ui/initialize", { appInfo: { name: "TableSimulator", version: "1.0.0" }, appCapabilities: {}, protocolVersion: "2026-01-26" });
        log("hostitel " + JSON.stringify((result && result.hostInfo) || {}) + " " + JSON.stringify((result && result.hostCapabilities) || {}).slice(0, 120));
      } catch (error) {
        log("ui/initialize chyba: " + JSON.stringify(error).slice(0, 160));
      }
      notify("ui/notifications/initialized", {});
      resize();
    })();
  </script>
</body>
</html>
